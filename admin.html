<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم - المدينة المنورة</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mut:#6b7385;--pr:#1ba97f;--bd:#e2e5ea;--red:#d64545;--warn:#e69b16}
@media(prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--tx:#e8ebf0;--mut:#98a1b3;--bd:#2b3240}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
textarea{min-height:70px}label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.red{background:var(--red)}.btn.sm{padding:5px 10px;font-size:13px}
.wrap{max-width:900px;margin:0 auto;padding:12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;position:sticky;top:49px;background:var(--bg);z-index:4}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:7px 14px;cursor:pointer}nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid .card{margin:0}.big{font-size:22px;font-weight:700}.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:120px}.between{display:flex;justify-content:space-between;gap:8px;align-items:center}
.bar{height:8px;background:var(--pr);border-radius:4px;margin-top:3px}.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:var(--bd)}
.hide{display:none!important}#login{max-width:340px;margin:12vh auto}dialog{border:0;border-radius:12px;max-width:520px;width:94%;background:var(--card);color:var(--tx);padding:14px}
dialog::backdrop{background:#0008}#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:8px;z-index:99;display:none}
.gv{position:relative;cursor:pointer}.badge{background:var(--red);color:#fff;border-radius:12px;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;padding:0 7px}
.gv .badge{position:absolute;top:-9px;inset-inline-end:12px;box-shadow:0 1px 4px #0005}.badge.sm{min-width:20px;height:20px;font-size:12px;padding:0 5px;margin-inline-start:4px}
.tag.warn{background:#fdecc8;color:#8a5a00}.tag.new{background:var(--red);color:#fff}.tag.ok{background:#d6f3e8;color:#0d6b4d}.money-red{color:var(--red)}
table.pt{width:100%;border-collapse:collapse}table.pt td,table.pt th{padding:6px 4px;text-align:start;border-bottom:1px solid var(--bd);font-size:14px}
.fl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-bottom:10px;padding:8px;border:1px dashed var(--bd);border-radius:8px}.newtxt{color:var(--red);font-weight:700}
</style>
</head>
<body>
<div id="toast"></div>

<div id="login" class="card">
  <h2 style="margin-top:0">لوحة التحكم</h2>
  <label>البريد الإلكتروني</label><input id="lEmail" type="email" autocomplete="username">
  <label>كلمة المرور</label><input id="lPass" type="password" autocomplete="current-password">
  <p id="lErr" class="mut" style="color:var(--red)"></p>
  <button class="btn" id="lBtn" style="width:100%">تسجيل الدخول</button>
</div>

<div id="app" class="hide">
  <header><b>المدينة المنورة · الإدارة</b><span><span id="who" class="mut"></span> <button class="btn sec sm" id="snd" title="صوت التنبيه">🔔</button> <button class="btn sec sm" id="out">خروج</button></span></header>
  <nav id="tabs"></nav>
  <div class="wrap" id="view"></div>
</div>

<dialog id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://gcfktmafehawspotidux.supabase.co', SB_KEY='sb_publishable_r_q-tcrfgEOQLEi0Kqc17g_rl1LyJPi';
const db=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Math.round(Number(n)||0).toLocaleString('ar-EG');
const fdate=d=>new Date(d).toLocaleString('ar-EG',{timeZone:'Africa/Cairo',dateStyle:'short',timeStyle:'short'});
const ST={new:'جديد',preparing:'قيد التجهيز',out_for_delivery:'خرج للتوصيل',delivered:'تم التسليم',cancelled:'ملغي'};
const PM={cod:'عند الاستلام',vodafone:'فودافون كاش',instapay:'Instapay'};
const PS={pending:'لم يُدفع',paid:'مدفوع',failed:'فشل'};
const CAT={stick:'استيك',cone:'كونو وبسكويتة',family:'عائلي وكب'};
let role='',govs=[],tab='stats';
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
async function q(p){const{data,error}=await p;if(error){toast('خطأ: '+error.message);throw error}return data}
const isAdmin=()=>role==='admin';

// ---------- تسجيل الدخول ----------
async function boot(){
  const{data:{session}}=await db.auth.getSession();
  if(!session){$('login').classList.remove('hide');$('app').classList.add('hide');return}
  const{data:p}=await db.from('profiles').select('role,email').eq('id',session.user.id).single();
  if(!p||!['admin','sales','warehouse'].includes(p.role)){await db.auth.signOut();$('lErr').textContent='هذا الحساب ليس له صلاحية الدخول.';$('login').classList.remove('hide');return}
  role=p.role;$('who').textContent=p.email+' ('+role+')';
  $('login').classList.add('hide');$('app').classList.remove('hide');
  const tabs=[['stats','الإحصائيات'],['orders','الطلبات'],['products','المنتجات'],['customers','العملاء']];
  $('tabs').innerHTML=tabs.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join('');
  show('orders');refreshBadge();startRealtime();
  if(!window._poll)window._poll=setInterval(poll,30000);
}
$('lBtn').onclick=async()=>{$('lErr').textContent='';const{error}=await db.auth.signInWithPassword({email:$('lEmail').value.trim(),password:$('lPass').value});if(error){$('lErr').textContent='بيانات الدخول غير صحيحة.';return}boot()};
$('out').onclick=async()=>{await db.auth.signOut();location.reload()};
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.t)};
function show(t){if(curGov)leaveGov();tab=t;curGov=null;[...$('tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('view').innerHTML='<p class="mut">جاري التحميل...</p>';({stats,orders,products,customers})[t]()}

// ---------- الإشعارات (رقم الطلبات الجديدة) ----------
let lastN=null,AC=null,soundOn=localStorage.getItem('snd')!=='0';
function unlock(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
document.addEventListener('click',unlock);document.addEventListener('touchstart',unlock);
function beep(){if(!soundOn)return;unlock();if(!AC)return;[0,.28,.56].forEach((t,i)=>{try{const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;o.frequency.value=i===1?988:784;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.4,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.24);o.start(s);o.stop(s+.26)}catch(e){}})}
function paintSnd(){$('snd').textContent=soundOn?'🔔':'🔕'}
$('snd').onclick=()=>{soundOn=!soundOn;localStorage.setItem('snd',soundOn?'1':'0');paintSnd();unlock();if(soundOn)beep()};
paintSnd();
async function refreshBadge(){
  const{data,error}=await db.from('v_orders_by_governorate').select('*');if(error)return null;
  const n=data.reduce((s,x)=>s+Number(x.unseen_count),0);lastN=n;
  const b=document.querySelector('#tabs [data-t=orders]');if(b)b.innerHTML='الطلبات'+(n?` <span class="badge sm">${n}</span>`:'');
  document.title=(n?`(${n}) `:'')+'لوحة التحكم - المدينة المنورة';return data}
let lastNewAt=0;
function onNewOrder(o){
  const now=Date.now();if(now-lastNewAt<3000)return;lastNewAt=now;   // تجاهل التكرار (صوت واحد لكل دفعة)
  try{beep()}catch(e){}
  toast('🛎 طلب جديد'+(o&&o.governorate_name?' من '+o.governorate_name:'')+(o&&o.customer_name?' — '+o.customer_name:''));
  refreshAfterNew(o&&o.governorate_name)}
async function refreshAfterNew(gov){
  try{const data=await refreshBadge();if(!data||$('dlg').open)return;
    if(tab==='orders'){if(!curGov)drawGovList(data);else if(gov===curGov||curGov==='—')refreshGov()}}catch(e){console.warn(e)}}
function startRealtime(){
  if(window._rt)return;
  try{window._rt=db.channel('orders-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'orders'},p=>onNewOrder(p.new)).subscribe(st=>{if(st==='CHANNEL_ERROR'||st==='TIMED_OUT')console.warn('realtime:',st)})}catch(e){console.warn('realtime off',e)}}
async function poll(){
  if(document.hidden||$('app').classList.contains('hide'))return;
  try{
    const prev=lastN;const data=await refreshBadge();if(!data)return;
    if(prev!==null&&lastN>prev&&Date.now()-lastNewAt>3000){lastNewAt=Date.now();beep()}
    if($('dlg').open)return;
    if(tab==='orders'){
      if(!curGov)drawGovList(data);
      else{const r=data.find(x=>x.governorate===curGov);if(r&&r.orders_count>ORD.length&&ORD.length<300)refreshGov()}}
  }catch(e){console.warn(e)}}

// ---------- الإحصائيات ----------
async function stats(){
  const today=new Date().toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'}),mon=today.slice(0,7);
  const[pay,byGov,top,cust,cnt]=await Promise.all([
    q(db.from('v_payment_daily').select('*').order('day',{ascending:false}).limit(1000)),
    q(db.from('v_orders_by_governorate').select('*').order('total_amount',{ascending:false}).limit(30)),
    q(db.from('v_top_products').select('*').limit(8)),
    q(db.from('v_customer_summary').select('*').order('last_order_at',{ascending:true,nullsFirst:false}).limit(300)),
    db.from('orders').select('id',{count:'exact',head:true}).eq('status','new')]);
  const sum=(a,f)=>a.reduce((s,x)=>s+Number(x[f]),0);
  const dT=pay.filter(d=>d.day===today),dM=pay.filter(d=>d.day.startsWith(mon));
  const bars=(rows,k,v,red)=>{const m=Math.max(1,...rows.map(r=>Number(r[v])));return rows.map(r=>`<div style="margin:8px 0"><div class="between"><span>${esc(r[k])}</span><b class="${red?'money-red':''}">${money(r[v])}</b></div><div class="bar" style="width:${Number(r[v])/m*100}%${red?';background:var(--red)':''}"></div></div>`).join('')||'<p class="mut">لا توجد بيانات بعد.</p>'};
  const old=cust.filter(c=>c.last_order_at&&(Date.now()-new Date(c.last_order_at))>30*864e5).slice(0,10);
  const prow=(l,rows)=>`<tr><th>${l}</th><td>${money(sum(rows,'total_amount'))}</td><td>${money(sum(rows,'paid_amount'))}</td><td class="money-red"><b>${money(sum(rows,'unpaid_amount'))}</b><div class="mut">${sum(rows,'unpaid_count')} طلب</div></td></tr>`;
  const unpaidGov=byGov.filter(g=>Number(g.unpaid_amount)>0).sort((a,b)=>b.unpaid_amount-a.unpaid_amount);
  $('view').innerHTML=`<div class="grid">
   <div class="card"><div class="mut">طلبات اليوم</div><div class="big">${money(sum(dT,'total_amount'))}</div><div class="mut">${sum(dT,'orders_count')} طلب</div></div>
   <div class="card"><div class="mut">طلبات الشهر</div><div class="big">${money(sum(dM,'total_amount'))}</div><div class="mut">${sum(dM,'orders_count')} طلب</div></div>
   <div class="card"><div class="mut">طلبات جديدة (لم تُجهَّز)</div><div class="big">${cnt.count??0}</div></div>
   <div class="card"><div class="mut">متوسط الطلب (الشهر)</div><div class="big">${money(sum(dM,'total_amount')/Math.max(1,sum(dM,'orders_count')))}</div></div></div>
   <div class="card" style="margin-top:10px"><b>المدفوعات</b><table class="pt"><tr class="mut"><th></th><td>إجمالي الطلبات</td><td>تم تحصيله</td><td>لسه بره</td></tr>${prow('اليوم',dT)}${prow('الشهر',dM)}${prow('الكل',pay)}</table>
   <p class="mut" style="margin:8px 0 0">"لسه بره" = طلبات مش متعلّم عليها "مدفوع" (غير الملغية). علّم الطلب "مدفوع" من صفحة الطلبات أول ما تستلم الفلوس.</p></div>
   <div class="card"><b>تقرير فترة</b><div class="row"><div><label>من</label><input type="date" id="rf"></div><div><label>إلى</label><input type="date" id="rt2"></div></div><div id="rr" class="mut" style="margin-top:8px">اختار تاريخ البداية والنهاية.</div><button class="btn sec sm" id="rx" style="margin-top:8px">تصدير طلبات الفترة CSV</button></div>
   <div class="card"><b>الفلوس اللي بره حسب المحافظة</b>${bars(unpaidGov,'governorate','unpaid_amount',true)}</div>
   <div class="card"><b>آخر 14 يوم (إجمالي الطلبات)</b>${bars(pay.slice(0,14).reverse().map(d=>({l:d.day.slice(5),v:d.total_amount})),'l','v')}</div>
   <div class="card"><b>الطلبات حسب المحافظة</b>${bars(byGov.map(g=>({governorate:g.governorate,v:g.total_amount})).slice(0,12),'governorate','v')}</div>
   <div class="card"><b>الأكثر مبيعًا (كراتين)</b>${bars(top,'product','cartons_sold')}</div>
   <div class="card"><b>عملاء لم يطلبوا من 30 يوم</b>${old.map(c=>`<div class="between" style="margin:6px 0"><span>${esc(c.full_name)}</span><span class="mut">${esc(c.phone)} · ${fdate(c.last_order_at)}</span></div>`).join('')||'<p class="mut">لا يوجد.</p>'}</div>`;
  const rng=()=>{const a=$('rf').value,b=$('rt2').value;if(!a||!b){$('rr').textContent='اختار تاريخ البداية والنهاية.';return}
    const rows=pay.filter(d=>d.day>=a&&d.day<=b);
    $('rr').innerHTML=`<table class="pt"><tr class="mut"><td>الطلبات</td><td>الإجمالي</td><td>محصّل</td><td>لسه بره</td></tr><tr><td><b>${sum(rows,'orders_count')}</b></td><td><b>${money(sum(rows,'total_amount'))}</b></td><td><b>${money(sum(rows,'paid_amount'))}</b></td><td class="money-red"><b>${money(sum(rows,'unpaid_amount'))}</b></td></tr></table>`};
  $('rf').onchange=rng;$('rt2').onchange=rng;
  $('rx').onclick=async()=>{const a=$('rf').value,b=$('rt2').value;if(!a||!b){toast('اختار الفترة الأول');return}
    toast('جاري التجهيز...');const from=new Date(a+'T00:00:00').toISOString(),to=new Date(b+'T23:59:59.999').toISOString();let all=[],s=0;
    for(;;){const r=await q(db.from('orders').select('*,order_items(*)').gte('created_at',from).lte('created_at',to).order('created_at',{ascending:false}).range(s,s+999));all=all.concat(r);if(r.length<1000)break;s+=1000}
    csv(all,`orders-${a}_${b}.csv`)};
}

// ---------- الطلبات (مقسّمة حسب المحافظة) ----------
let ORD=[],curGov=null,NEWSET=new Set();
async function orders(){curGov=null;await drawGovList()}
async function drawGovList(pre){
  const G=(pre||await refreshBadge()||[]).slice().sort((a,b)=>(Number(b.unseen_count)>0)-(Number(a.unseen_count)>0)||new Date(b.last_order_at)-new Date(a.last_order_at));
  if(tab!=='orders'||curGov)return;
  $('view').innerHTML=(G.length?G.map((g,i)=>{const n=Number(g.unseen_count);return `<div class="card gv" data-i="${i}">${n>0?`<span class="badge">${n}</span>`:''}<div class="between"><b style="font-size:17px">${esc(g.governorate)}</b><span class="mut">${g.orders_count} طلب</span></div>
   <div class="${n>0?'newtxt':'mut'}" style="margin-top:4px">${n>0?(n===1?'طلب جديد':n+' طلبات جديدة'):'مفيش طلبات جديدة'}</div></div>`}).join(''):'<div class="card mut">لا توجد طلبات بعد. المحافظة بتظهر هنا أوتوماتيك أول ما عميل يطلب منها.</div>')
   +`<div class="row" style="margin-top:14px"><button class="btn sec" id="xall">تصدير كل الطلبات CSV</button>${isAdmin()?'<button class="btn red" id="rst">مسح كل الطلبات</button>':''}</div>`;
  $('view').querySelectorAll('.gv').forEach(c=>c.onclick=()=>openGov(G[c.dataset.i].governorate));
  $('xall').onclick=exportAll;if(isAdmin())$('rst').onclick=resetDialog;
}
function govQuery(name){let qy=db.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}).limit(300);return name==='—'?qy.is('governorate_name',null):qy.eq('governorate_name',name)}
async function openGov(name){
  curGov=name;$('view').innerHTML='<p class="mut">جاري التحميل...</p>';
  ORD=await q(govQuery(name));
  NEWSET=new Set(ORD.filter(o=>!o.seen).map(o=>o.id));   // بتتعلّم "اتشافت" لما تخرج من المحافظة
  $('view').innerHTML=`<div class="between" style="margin-bottom:8px"><button class="btn sec sm" id="bk">← كل المحافظات</button><b>${esc(name)}</b></div>
   <div class="card"><div class="row"><input id="fq" placeholder="بحث: اسم / تليفون / رقم طلب">
   <select id="fs"><option value="">كل الحالات</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
   <select id="fp"><option value="">كل المدفوعات</option><option value="unpaid">غير مدفوع</option><option value="paid">مدفوع</option></select></div>
   <div class="row" style="margin-top:6px"><input id="fa" type="date"><input id="fb" type="date"><button class="btn sec" id="csv">تصدير CSV</button></div></div><div id="ol"></div>`;
  ['fq','fs','fp','fa','fb'].forEach(i=>$(i).oninput=drawOrders);$('csv').onclick=()=>csv(filtered(),'orders-'+name+'.csv');
  $('bk').onclick=async()=>{await leaveGov();curGov=null;orders()};drawOrders();
}
async function leaveGov(){
  const ids=[...NEWSET];NEWSET=new Set();
  if(ids.length){try{await db.from('orders').update({seen:true}).in('id',ids)}catch(e){}}
  refreshBadge()}
async function refreshGov(){   // تحديث هادي من غير ما الصفحة تتقفل أو ترجع لأول
  try{const{data,error}=await govQuery(curGov);if(error||!data)return;
    const known=new Set(ORD.map(o=>o.id));if(!data.some(o=>!known.has(o.id)))return;
    ORD=data;data.filter(o=>!o.seen).forEach(o=>NEWSET.add(o.id));if($('ol'))drawOrders()}catch(e){console.warn(e)}}
function filtered(){const t=$('fq').value.trim().toLowerCase(),s=$('fs').value,p=$('fp').value,a=$('fa').value,b=$('fb').value;
  return ORD.filter(o=>(!t||(o.customer_name+o.customer_phone+o.order_number).toLowerCase().includes(t))&&(!s||o.status===s)&&(!p||(p==='paid'?o.payment_status==='paid':o.payment_status!=='paid'))&&(!a||o.created_at.slice(0,10)>=a)&&(!b||o.created_at.slice(0,10)<=b))}
function drawOrders(){const L=filtered();$('ol').innerHTML=`<p class="mut">${L.length} طلب</p>`+L.map(o=>`<div class="card"><div class="between"><b>${esc(o.order_number)} ${NEWSET.has(o.id)?'<span class="tag new">جديد</span>':''}</b><span class="tag">${esc(ST[o.status])}</span></div>
  <div>${esc(o.customer_name)} · <a href="tel:${esc(o.customer_phone)}">${esc(o.customer_phone)}</a></div><div class="mut">${esc(o.address)}</div>
  <div class="mut">${fdate(o.created_at)} · ${esc(PM[o.payment_method])} ${o.payment_status==='paid'?'<span class="tag ok">مدفوع</span>':'<span class="tag warn">'+esc(PS[o.payment_status])+'</span>'}${o.transaction_ref?' · عملية '+esc(o.transaction_ref):''}</div>
  <ul style="margin:8px 0;padding-inline-start:18px">${(o.order_items||[]).map(i=>`<li>${esc(i.product_name_ar)}${i.flavor_name?' - '+esc(i.flavor_name):''} × ${i.cartons_qty} كرتونة = ${money(i.line_total)}</li>`).join('')}</ul>
  <div><b>الإجمالي ${money(o.total)}</b></div>
  <div class="row" style="margin-top:8px"><select data-id="${o.id}" data-f="status">${Object.entries(ST).map(([k,v])=>`<option value="${k}"${k===o.status?' selected':''}>${v}</option>`).join('')}</select>
  <select data-id="${o.id}" data-f="payment_status">${Object.entries(PS).map(([k,v])=>`<option value="${k}"${k===o.payment_status?' selected':''}>${v}</option>`).join('')}</select></div>
  <div class="row" style="margin-top:6px"><button class="btn sec sm" data-print="${o.id}">🖨 طباعة</button><button class="btn sec sm" data-wa="${o.id}">📲 واتساب</button>${o.customer_email?`<button class="btn sec sm" data-mail="${o.id}">✉ إيميل</button>`:''}${isAdmin()?`<button class="btn sec sm" data-edit="${o.id}">✏️ تعديل الطلب</button>`:''}</div></div>`).join('');
  $('ol').querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>printOrder(b.dataset.print));
  $('ol').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editOrder(b.dataset.edit));
  $('ol').querySelectorAll('[data-wa]').forEach(b=>b.onclick=()=>sendDialog(ORD.find(x=>x.id==b.dataset.wa)));
  $('ol').querySelectorAll('[data-mail]').forEach(b=>b.onclick=()=>sendDialog(ORD.find(x=>x.id==b.dataset.mail)));
  $('ol').querySelectorAll('select[data-id]').forEach(s=>s.onchange=async()=>{
    const o=ORD.find(x=>x.id==s.dataset.id);const upd={[s.dataset.f]:s.value};let msg='تم الحفظ';
    if(s.dataset.f==='status'&&s.value==='delivered'&&o.payment_method==='cod'&&o.payment_status!=='paid'){upd.payment_status='paid';msg='تم التسليم وتعليم الطلب مدفوع'}
    await q(db.from('orders').update(upd).eq('id',o.id));Object.assign(o,upd);toast(msg);drawOrders();
    if(s.dataset.f==='status'&&s.value==='out_for_delivery')sendDialog(o,'invoice')})}
function csv(L,name){const c=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['رقم الطلب','التاريخ','الاسم','التليفون','المحافظة','العنوان','المنتجات','الدفع','حالة الدفع','الحالة','الإجمالي'].map(c).join(',')].concat(L.map(o=>[o.order_number,fdate(o.created_at),o.customer_name,o.customer_phone,o.governorate_name,o.address,(o.order_items||[]).map(i=>i.product_name_ar+(i.flavor_name?' - '+i.flavor_name:'')+' x'+i.cartons_qty).join(' | '),PM[o.payment_method],PS[o.payment_status],ST[o.status],o.total].map(c).join(',')));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv'}));a.download=name;a.click()}
async function exportAll(){toast('جاري التجهيز...');let all=[],from=0;for(;;){const r=await q(db.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}).range(from,from+999));all=all.concat(r);if(r.length<1000)break;from+=1000}csv(all,'orders-all.csv')}
function resetDialog(){const d=$('dlg');
  d.innerHTML=`<h3 style="color:var(--red);margin-top:0">مسح كل الطلبات</h3><p>هيتم مسح <b>كل الطلبات</b> وبنودها وسجلها <b>نهائيًا</b> ومينفعش تتراجع. الترقيم هيبدأ من <b>GL-1001</b> من جديد. جوجل شيت مش هيتأثر.</p><p class="mut">📥 هيتنزّل ملف CSV بكل الطلبات أوتوماتيك قبل المسح كنسخة احتياطية.</p>
  <label><input type="checkbox" id="rc" style="width:auto"> امسح قاعدة العملاء كمان</label><label>اكتب كلمة <b>مسح</b> للتأكيد</label><input id="rt" autocomplete="off">
  <div class="row" style="margin-top:10px"><button class="btn red" id="rgo">مسح نهائي</button><button class="btn sec" id="rno">إلغاء</button></div>`;
  d.showModal();$('rno').onclick=()=>d.close();
  $('rgo').onclick=async()=>{if($('rt').value.trim()!=='مسح'){toast('اكتب كلمة مسح للتأكيد');return}
    $('rgo').disabled=true;try{await exportAll()}catch(e){$('rgo').disabled=false;toast('فشل النسخ الاحتياطي، اتلغى المسح');return}
    await new Promise(r=>setTimeout(r,800));
    await q(db.rpc('admin_reset_orders',{p_delete_customers:$('rc').checked}));d.close();toast('تم مسح الطلبات');refreshBadge();orders()}}

// ---------- رسائل العميل (واتساب / إيميل) ----------
const intlPhone=p=>{p=String(p||'').replace(/\D/g,'');return p.startsWith('0')?'20'+p.slice(1):p};
const trackUrl=o=>new URL('track.html?o='+encodeURIComponent(o.order_number),location.href).href;
function orderText(o,kind){
  const items=(o.order_items||[]).map(i=>`• ${i.product_name_ar}${i.flavor_name?' - '+i.flavor_name:''} × ${i.cartons_qty} كرتونة = ${money(i.line_total)}`).join('\n');
  if(kind==='invoice')return `أهلاً ${o.customer_name} 👋\nطلبك رقم ${o.order_number} خرج للتوصيل 🚚\n\nفاتورة الطلب:\n${items}\n\nالإجمالي: ${money(o.total)} جنيه\n${o.payment_status==='paid'?'تم الدفع ✅':'المطلوب عند الاستلام: '+money(o.total)+' جنيه'}\n\nتابع حالة طلبك:\n${trackUrl(o)}\n\nالمدينة المنورة`;
  return `أهلاً ${o.customer_name} 👋\nتم استلام طلبك رقم ${o.order_number} ✅\n\n${items}\n\nالإجمالي: ${money(o.total)} جنيه\n\nتابع حالة طلبك من هنا:\n${trackUrl(o)}\n\nالمدينة المنورة`}
function sendDialog(o,kind){
  if(!o)return;const d=$('dlg');kind=kind||'confirm';
  const wa=k=>'https://wa.me/'+intlPhone(o.customer_phone)+'?text='+encodeURIComponent(orderText(o,k));
  const mail=k=>'mailto:'+encodeURIComponent(o.customer_email||'')+'?subject='+encodeURIComponent((k==='invoice'?'فاتورة طلبك ':'تأكيد طلبك ')+o.order_number+' - المدينة المنورة')+'&body='+encodeURIComponent(orderText(o,k));
  d.innerHTML=`<h3 style="margin-top:0">إرسال للعميل — ${esc(o.customer_name)}</h3>
   ${kind==='invoice'?'<p>الطلب خرج للتوصيل. تبعت الفاتورة للعميل؟</p>':'<p class="mut">اختار الرسالة، وهيتفتح واتساب (أو الإيميل) والرسالة جاهزة، وانت بتضغط إرسال.</p>'}
   <div class="row"><a class="btn" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="${wa('invoice')}">📲 الفاتورة (واتساب)</a>
   <a class="btn sec" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="${wa('confirm')}">📲 تأكيد + رابط التتبع</a></div>
   ${o.customer_email?`<div class="row" style="margin-top:8px"><a class="btn sec" style="text-align:center;text-decoration:none" href="${mail('invoice')}">✉ الفاتورة (إيميل)</a><a class="btn sec" style="text-align:center;text-decoration:none" href="${mail('confirm')}">✉ تأكيد + رابط التتبع</a></div>`:''}
   <div class="row" style="margin-top:10px"><button class="btn sec" id="sc">إغلاق</button></div>`;
  d.showModal();$('sc').onclick=()=>d.close()}

// ---------- تعديل الطلب (للأدمن) ----------
let PRODS=null;
async function loadProds(){if(!PRODS)PRODS=await q(db.from('products').select('id,name_ar,price,flavors,is_active').order('sort_order').order('id'));return PRODS}
async function editOrder(id){
  const o=ORD.find(x=>x.id==id);if(!o)return;
  if((o.order_items||[]).some(i=>!i.product_id)){toast('الطلب فيه منتج محذوف، مينفعش تعديله');return}
  await loadProds();
  let rows=(o.order_items||[]).map(i=>({product_id:i.product_id,flavor_id:i.flavor_id,name:i.product_name_ar+(i.flavor_name?' - '+i.flavor_name:''),qty:i.cartons_qty,price:Number(i.unit_price_per_carton)}));
  const d=$('dlg');
  const total=()=>rows.reduce((s,r)=>s+(Number(r.qty)||0)*(Number(r.price)||0),0);
  const fillFl=()=>{const p=PRODS.find(x=>x.id==$('ap').value),f=(p&&p.flavors)||[];$('af2').innerHTML=f.map(x=>`<option value="${esc(x.id)}">${esc(x.name_ar)}</option>`).join('');$('af2').classList.toggle('hide',!f.length)};
  const draw=()=>{
    d.innerHTML=`<h3 style="margin-top:0">تعديل ${esc(o.order_number)}</h3><p class="mut">جوجل شيت مش بيتحدّث بالتعديل.</p>
    ${rows.map((r,i)=>`<div class="card" style="padding:8px"><div class="between"><b>${esc(r.name)}</b><button class="btn red sm" data-x="${i}">×</button></div><div class="row"><div><label>الكراتين</label><input type="number" min="1" data-q="${i}" value="${r.qty}"></div><div><label>سعر الكرتونة</label><input type="number" min="0" data-p="${i}" value="${r.price}"></div></div></div>`).join('')}
    <label>إضافة منتج</label><div class="row"><select id="ap">${PRODS.filter(p=>p.is_active).map(p=>`<option value="${p.id}">${esc(p.name_ar)}</option>`).join('')}</select><select id="af2"></select><button class="btn sec" id="aa" style="flex:0 0 auto">+ إضافة</button></div>
    <p><b>الإجمالي الجديد: <span id="tot">${money(total()+Number(o.shipping_fee))}</span></b></p>
    <div class="row"><button class="btn" id="es">حفظ التعديل</button><button class="btn sec" id="ec">إلغاء</button></div>`;
    fillFl();$('ap').onchange=fillFl;
    d.querySelectorAll('[data-q]').forEach(x=>x.oninput=()=>{rows[x.dataset.q].qty=x.value;$('tot').textContent=money(total()+Number(o.shipping_fee))});
    d.querySelectorAll('[data-p]').forEach(x=>x.oninput=()=>{rows[x.dataset.p].price=x.value;$('tot').textContent=money(total()+Number(o.shipping_fee))});
    d.querySelectorAll('[data-x]').forEach(x=>x.onclick=()=>{rows.splice(x.dataset.x,1);draw()});
    $('aa').onclick=()=>{const p=PRODS.find(x=>x.id==$('ap').value);if(!p)return;let fid=null,fn='',pr=Number(p.price);
      if(p.flavors&&p.flavors.length){const f=p.flavors.find(x=>x.id===$('af2').value)||p.flavors[0];fid=f.id;fn=' - '+f.name_ar;if(f.price)pr=Number(f.price)}
      rows.push({product_id:p.id,flavor_id:fid,name:p.name_ar+fn,qty:1,price:pr});draw()};
    $('ec').onclick=()=>d.close();
    $('es').onclick=async()=>{
      if(!rows.length){toast('لازم يفضل منتج واحد على الأقل');return}
      if(rows.some(r=>!(Number(r.qty)>=1&&Number.isInteger(Number(r.qty)))||!(Number(r.price)>=0))){toast('راجع الكميات والأسعار');return}
      await q(db.rpc('admin_update_order',{p_order_id:o.id,p_items:rows.map(r=>({product_id:r.product_id,flavor_id:r.flavor_id||null,qty:Number(r.qty),unit_price:Number(r.price)}))}));
      d.close();toast('تم تعديل الطلب');openGov(curGov)}};
  draw();d.showModal()}

// ---------- طباعة فاتورة / بوليصة ----------
function printOrder(id){
  const o=ORD.find(x=>x.id==id);if(!o)return;
  const w=window.open('','_blank');if(!w){toast('اسمح بالنوافذ المنبثقة للطباعة');return}
  const items=(o.order_items||[]).map(i=>`<tr><td>${esc(i.product_name_ar)}${i.flavor_name?' - '+esc(i.flavor_name):''}</td><td>${i.cartons_qty}</td><td>${money(i.unit_price_per_carton)}</td><td>${money(i.line_total)}</td></tr>`).join('');
  w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${esc(o.order_number)}</title><style>
  body{font-family:Tahoma,Arial,sans-serif;margin:18px;color:#111;font-size:15px}h1{margin:0 0 4px;font-size:22px}.r{display:flex;justify-content:space-between}
  .box{border:2px solid #111;border-radius:8px;padding:10px;margin:10px 0}.big{font-size:20px;font-weight:700}table{width:100%;border-collapse:collapse;margin-top:8px}
  th,td{border:1px solid #999;padding:6px;text-align:start}th{background:#eee}.tot{font-size:18px;font-weight:700;margin-top:8px}.m{color:#555;font-size:13px}</style></head><body>
  <div class="r"><div><h1>المدينة المنورة</h1><div class="m">فاتورة / بوليصة شحن</div></div><div style="text-align:left"><div class="big">${esc(o.order_number)}</div><div class="m">${fdate(o.created_at)}</div></div></div>
  <div class="box"><div class="big">${esc(o.customer_name)}</div><div class="big">${esc(o.customer_phone)}</div><div>${esc(o.governorate_name)} — ${esc(o.address)}</div></div>
  <table><tr><th>المنتج</th><th>كراتين</th><th>سعر الكرتونة</th><th>الإجمالي</th></tr>${items}</table>
  <div class="tot">الإجمالي: ${money(o.total)} جنيه</div>
  <div class="m" style="margin-top:6px">الدفع: ${esc(PM[o.payment_method])} — ${o.payment_status==='paid'?'مدفوع':'المطلوب تحصيله عند الاستلام: '+money(o.total)+' جنيه'}${o.transaction_ref?' — عملية '+esc(o.transaction_ref):''}</div>
  <script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`);
  w.document.close()}

// ---------- المنتجات ----------
let PRD=[];
async function products(){
  PRD=await q(db.from('products').select('*').order('sort_order').order('id'));
  $('view').innerHTML=(isAdmin()?'<button class="btn" id="np" style="margin-bottom:10px">+ منتج جديد</button>':'')+PRD.map(p=>`<div class="card between"><div style="flex:1"><b>${esc(p.name_ar)}</b> ${p.is_active?'':'<span class="tag">مخفي</span>'}<div class="mut">${money(p.price)} للكرتونة · ${esc(CAT[p.category]||'بدون فئة')} · ${(p.flavors||[]).length} نكهات</div></div>${isAdmin()?`<button class="btn sec sm" data-e="${p.id}">تعديل</button>`:''}</div>`).join('');
  if(isAdmin()){$('np').onclick=()=>prodForm();$('view').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>prodForm(PRD.find(x=>x.id==b.dataset.e)))}
}
function flRow(f={}){return `<div class="fl"><input placeholder="كود (مثال: choc)" value="${esc(f.id)}"><input placeholder="الاسم عربي" value="${esc(f.name_ar)}"><input placeholder="English" value="${esc(f.name_en)}"><input placeholder="سعر (اختياري)" type="number" value="${f.price??''}"><input placeholder="صورة النكهة (img/... أو رابط)" style="grid-column:span 2" value="${esc(f.image)}"><button type="button" class="btn sec sm" data-up>📷 رفع صورة</button><button type="button" class="btn red sm" onclick="this.closest('.fl').remove()">× حذف النكهة</button></div>`}
function prodForm(p){p=p||{price:0,is_active:true,sort_order:PRD.length+1,flavors:[]};const d=$('dlg');
  d.innerHTML=`<h3 style="margin-top:0">${p.id?'تعديل منتج':'منتج جديد'}</h3>
  <label>الاسم (عربي)</label><input id="pa" value="${esc(p.name_ar)}"><label>الاسم (English)</label><input id="pe" value="${esc(p.name_en)}">
  <label>الوصف (عربي)</label><textarea id="da">${esc(p.description_ar)}</textarea><label>الوصف (English)</label><textarea id="de">${esc(p.description_en)}</textarea>
  <div class="row"><div><label>سعر الكرتونة</label><input id="pp" type="number" value="${p.price}"></div><div><label>قطع/كرتونة</label><input id="pc" type="number" value="${p.pieces_per_carton??''}"></div>
  <div><label>الفئة</label><select id="pf"><option value="">بدون</option>${Object.entries(CAT).map(([k,v])=>`<option value="${k}"${p.category===k?' selected':''}>${v}</option>`).join('')}</select></div><div><label>الترتيب</label><input id="ps" type="number" value="${p.sort_order}"></div></div>
  <label>الصورة (رابط أو مسار مثل img/product-9.jpeg)</label><input id="pi" value="${esc(p.image_url)}"><input id="pu" type="file" accept="image/*" style="margin-top:4px">
  <label>النكهات (اتركها فاضية لو مفيش)</label><div id="fls">${(p.flavors||[]).map(flRow).join('')}</div><button type="button" class="btn sec sm" id="af">+ نكهة</button>
  <label><input id="pv" type="checkbox" style="width:auto" ${p.is_active?'checked':''}> ظاهر في الموقع</label>
  <div class="row" style="margin-top:10px"><button class="btn" id="sv">حفظ</button><button class="btn sec" id="cl">إلغاء</button>${p.id?'<button class="btn red" id="dl">حذف</button>':''}</div>`;
  d.showModal();$('cl').onclick=()=>d.close();$('af').onclick=()=>$('fls').insertAdjacentHTML('beforeend',flRow());
  const upImg=async f=>{const n='p'+Date.now()+'.'+f.name.split('.').pop();const{error}=await db.storage.from('product-images').upload(n,f);if(error){toast('الرفع فشل (لازم bucket التخزين يكون متعمل): '+error.message);return null}toast('تم رفع الصورة');return db.storage.from('product-images').getPublicUrl(n).data.publicUrl};
  $('pu').onchange=async e=>{const f=e.target.files[0];if(!f)return;const u=await upImg(f);if(u)$('pi').value=u};
  $('fls').onclick=e=>{const b=e.target.closest('[data-up]');if(!b)return;const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const u=await upImg(f);if(u)b.closest('.fl').querySelectorAll('input')[4].value=u};inp.click()};
  $('sv').onclick=async()=>{const fl=[...$('fls').children].map(r=>{const i=r.querySelectorAll('input');const o={id:i[0].value.trim(),name_ar:i[1].value.trim(),name_en:i[2].value.trim()||i[1].value.trim()};if(i[3].value!=='')o.price=Number(i[3].value);if(i[4].value.trim())o.image=i[4].value.trim();return o}).filter(o=>o.id&&o.name_ar);
    const row={name_ar:$('pa').value.trim(),name_en:$('pe').value.trim()||null,description_ar:$('da').value.trim()||null,description_en:$('de').value.trim()||null,price:Number($('pp').value),pieces_per_carton:$('pc').value?Number($('pc').value):null,category:$('pf').value||null,sort_order:Number($('ps').value)||0,image_url:$('pi').value.trim()||null,flavors:fl,is_active:$('pv').checked};
    if(!row.name_ar||!(row.price>=0)){toast('الاسم والسعر مطلوبين');return}
    await q(p.id?db.from('products').update(row).eq('id',p.id):db.from('products').insert(row));d.close();toast('تم الحفظ');products()};
  if(p.id)$('dl').onclick=async()=>{if(!confirm('حذف المنتج نهائيًا؟ (الأفضل إخفاؤه)'))return;await q(db.from('products').delete().eq('id',p.id));d.close();products()}}

// ---------- العملاء ----------
async function customers(){
  const C=await q(db.from('v_customer_summary').select('*').order('total_spent',{ascending:false}).limit(300));
  $('view').innerHTML=`<input id="cq" placeholder="بحث بالاسم أو التليفون" style="margin-bottom:10px"><div id="cl2"></div>`;
  const draw=()=>{const t=$('cq').value.trim().toLowerCase();$('cl2').innerHTML=C.filter(c=>!t||(c.full_name+c.phone).toLowerCase().includes(t)).map(c=>`<div class="card" data-c="${c.id}" style="cursor:pointer"><div class="between"><b>${esc(c.full_name)}</b><span>${money(c.total_spent)}</span></div><div class="mut">${esc(c.phone)} · ${esc(c.governorate||'')} · ${c.orders_count} طلب${c.last_order_at?' · آخر طلب '+fdate(c.last_order_at):''}</div><div class="cd"></div></div>`).join('')||'<p class="mut">لا يوجد عملاء.</p>'};
  draw();$('cq').oninput=draw;
  $('cl2').onclick=async e=>{const c=e.target.closest('[data-c]');if(!c)return;const box=c.querySelector('.cd');if(box.innerHTML){box.innerHTML='';return}
    const O=await q(db.from('orders').select('order_number,created_at,total,status').eq('customer_id',c.dataset.c).order('created_at',{ascending:false}).limit(30));
    box.innerHTML=O.map(o=>`<div class="between mut" style="margin-top:4px"><span>${esc(o.order_number)} · ${fdate(o.created_at)}</span><span>${money(o.total)} · ${esc(ST[o.status])}</span></div>`).join('')}}


boot();
</script>
