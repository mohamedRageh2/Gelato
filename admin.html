<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم - المدينة المنورة</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mut:#6b7385;--pr:#1ba97f;--bd:#e2e5ea;--red:#d64545;--warn:#e69b16}
@media(prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--tx:#e8ebf0;--mut:#98a1b3;--bd:#2b3240}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
textarea{min-height:70px}label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.red{background:var(--red)}.btn.sm{padding:5px 10px;font-size:13px}
.wrap{max-width:900px;margin:0 auto;padding:12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;position:sticky;top:49px;background:var(--bg);z-index:4}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:7px 14px;cursor:pointer}nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid .card{margin:0}.big{font-size:22px;font-weight:700}.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:120px}.between{display:flex;justify-content:space-between;gap:8px;align-items:center}
.bar{height:8px;background:var(--pr);border-radius:4px;margin-top:3px}.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:var(--bd)}
.hide{display:none!important}#login{max-width:340px;margin:12vh auto}dialog{border:0;border-radius:12px;max-width:520px;width:94%;background:var(--card);color:var(--tx);padding:14px}
dialog::backdrop{background:#0008}#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:8px;z-index:99;display:none}
.fl{display:grid;grid-template-columns:1fr 1fr 1fr 70px 34px;gap:4px;margin-bottom:4px}
</style>
</head>
<body>
<div id="toast"></div>

<div id="login" class="card">
  <h2 style="margin-top:0">لوحة التحكم</h2>
  <label>البريد الإلكتروني</label><input id="lEmail" type="email" autocomplete="username">
  <label>كلمة المرور</label><input id="lPass" type="password" autocomplete="current-password">
  <p id="lErr" class="mut" style="color:var(--red)"></p>
  <button class="btn" id="lBtn" style="width:100%">تسجيل الدخول</button>
</div>

<div id="app" class="hide">
  <header><b>المدينة المنورة · الإدارة</b><span><span id="who" class="mut"></span> <button class="btn sec sm" id="out">خروج</button></span></header>
  <nav id="tabs"></nav>
  <div class="wrap" id="view"></div>
</div>

<dialog id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://gcfktmafehawspotidux.supabase.co', SB_KEY='sb_publishable_r_q-tcrfgEOQLEi0Kqc17g_rl1LyJPi';
const db=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Math.round(Number(n)||0).toLocaleString('ar-EG');
const fdate=d=>new Date(d).toLocaleString('ar-EG',{timeZone:'Africa/Cairo',dateStyle:'short',timeStyle:'short'});
const ST={new:'جديد',preparing:'قيد التجهيز',out_for_delivery:'خرج للتوصيل',delivered:'تم التسليم',cancelled:'ملغي'};
const PM={cod:'عند الاستلام',vodafone:'فودافون كاش',instapay:'Instapay'};
const PS={pending:'لم يُدفع',paid:'مدفوع',failed:'فشل'};
const CAT={stick:'استيك',cone:'كونو وبسكويتة',family:'عائلي وكب'};
let role='',govs=[],tab='stats';
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
async function q(p){const{data,error}=await p;if(error){toast('خطأ: '+error.message);throw error}return data}
const isAdmin=()=>role==='admin';

// ---------- تسجيل الدخول ----------
async function boot(){
  const{data:{session}}=await db.auth.getSession();
  if(!session){$('login').classList.remove('hide');$('app').classList.add('hide');return}
  const{data:p}=await db.from('profiles').select('role,email').eq('id',session.user.id).single();
  if(!p||!['admin','sales','warehouse'].includes(p.role)){await db.auth.signOut();$('lErr').textContent='هذا الحساب ليس له صلاحية الدخول.';$('login').classList.remove('hide');return}
  role=p.role;$('who').textContent=p.email+' ('+role+')';
  $('login').classList.add('hide');$('app').classList.remove('hide');
  govs=await q(db.from('governorates').select('*').order('sort_order'));
  const tabs=[['stats','الإحصائيات'],['orders','الطلبات'],['products','المنتجات'],['customers','العملاء'],['gov','المحافظات']];
  $('tabs').innerHTML=tabs.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join('');
  show('stats');
}
$('lBtn').onclick=async()=>{$('lErr').textContent='';const{error}=await db.auth.signInWithPassword({email:$('lEmail').value.trim(),password:$('lPass').value});if(error){$('lErr').textContent='بيانات الدخول غير صحيحة.';return}boot()};
$('out').onclick=async()=>{await db.auth.signOut();location.reload()};
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.t)};
function show(t){tab=t;[...$('tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('view').innerHTML='<p class="mut">جاري التحميل...</p>';({stats,orders,products,customers,gov})[t]()}

// ---------- الإحصائيات ----------
async function stats(){
  const today=new Date().toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'}),mon=today.slice(0,7);
  const[daily,byGov,top,cust,cnt]=await Promise.all([
    q(db.from('v_sales_daily').select('*').limit(62)),
    q(db.from('v_sales_by_governorate').select('*').limit(12)),
    q(db.from('v_top_products').select('*').limit(8)),
    q(db.from('v_customer_summary').select('*').order('last_order_at',{ascending:true,nullsFirst:false}).limit(300)),
    db.from('orders').select('id',{count:'exact',head:true}).eq('status','new')]);
  const sum=(a,f)=>a.reduce((s,x)=>s+Number(x[f]),0);
  const dT=daily.filter(d=>d.day===today),dM=daily.filter(d=>d.day.startsWith(mon));
  const bars=(rows,k,v)=>{const m=Math.max(1,...rows.map(r=>Number(r[v])));return rows.map(r=>`<div style="margin:8px 0"><div class="between"><span>${esc(r[k])}</span><b>${money(r[v])}</b></div><div class="bar" style="width:${Number(r[v])/m*100}%"></div></div>`).join('')||'<p class="mut">لا توجد بيانات بعد.</p>'};
  const old=cust.filter(c=>c.last_order_at&&(Date.now()-new Date(c.last_order_at))>30*864e5).slice(0,10);
  $('view').innerHTML=`<div class="grid">
   <div class="card"><div class="mut">مبيعات اليوم</div><div class="big">${money(sum(dT,'total_sales'))}</div><div class="mut">${sum(dT,'orders_count')} طلب</div></div>
   <div class="card"><div class="mut">مبيعات الشهر</div><div class="big">${money(sum(dM,'total_sales'))}</div><div class="mut">${sum(dM,'orders_count')} طلب</div></div>
   <div class="card"><div class="mut">طلبات جديدة</div><div class="big">${cnt.count??0}</div></div>
   <div class="card"><div class="mut">متوسط الطلب (الشهر)</div><div class="big">${money(sum(dM,'total_sales')/Math.max(1,sum(dM,'orders_count')))}</div></div></div>
   <div class="card" style="margin-top:10px"><b>آخر 14 يوم</b>${bars(daily.slice(0,14).reverse().map(d=>({l:d.day.slice(5),v:d.total_sales})),'l','v')}</div>
   <div class="card"><b>المبيعات حسب المحافظة</b>${bars(byGov,'governorate','total_sales')}</div>
   <div class="card"><b>الأكثر مبيعًا (كراتين)</b>${bars(top,'product','cartons_sold')}</div>
   <div class="card"><b>عملاء لم يطلبوا من 30 يوم</b>${old.map(c=>`<div class="between" style="margin:6px 0"><span>${esc(c.full_name)}</span><span class="mut">${esc(c.phone)} · ${fdate(c.last_order_at)}</span></div>`).join('')||'<p class="mut">لا يوجد.</p>'}</div>`;
}

// ---------- الطلبات ----------
let ORD=[];
async function orders(){
  ORD=await q(db.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}).limit(300));
  $('view').innerHTML=`<div class="card"><div class="row"><input id="fq" placeholder="بحث: اسم / تليفون / رقم طلب">
   <select id="fs"><option value="">كل الحالات</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
   <select id="fg"><option value="">كل المحافظات</option>${govs.map(g=>`<option>${esc(g.name_ar)}</option>`).join('')}</select></div>
   <div class="row" style="margin-top:6px"><input id="fa" type="date"><input id="fb" type="date"><button class="btn sec" id="csv">تصدير CSV</button></div></div><div id="ol"></div>`;
  ['fq','fs','fg','fa','fb'].forEach(i=>$(i).oninput=drawOrders);$('csv').onclick=exportCsv;drawOrders();
}
function filtered(){const t=$('fq').value.trim().toLowerCase(),s=$('fs').value,g=$('fg').value,a=$('fa').value,b=$('fb').value;
  return ORD.filter(o=>(!t||(o.customer_name+o.customer_phone+o.order_number).toLowerCase().includes(t))&&(!s||o.status===s)&&(!g||o.governorate_name===g)&&(!a||o.created_at.slice(0,10)>=a)&&(!b||o.created_at.slice(0,10)<=b))}
function drawOrders(){const L=filtered();$('ol').innerHTML=`<p class="mut">${L.length} طلب</p>`+L.map(o=>`<div class="card"><div class="between"><b>${esc(o.order_number)}</b><span class="tag">${esc(ST[o.status])}</span></div>
  <div>${esc(o.customer_name)} · <a href="tel:${esc(o.customer_phone)}">${esc(o.customer_phone)}</a></div><div class="mut">${esc(o.governorate_name)} — ${esc(o.address)}</div>
  <div class="mut">${fdate(o.created_at)} · ${esc(PM[o.payment_method])} (${esc(PS[o.payment_status])})${o.transaction_ref?' · عملية '+esc(o.transaction_ref):''}</div>
  <ul style="margin:8px 0;padding-inline-start:18px">${(o.order_items||[]).map(i=>`<li>${esc(i.product_name_ar)}${i.flavor_name?' - '+esc(i.flavor_name):''} × ${i.cartons_qty} كرتونة = ${money(i.line_total)}</li>`).join('')}</ul>
  <div class="between"><span>شحن ${money(o.shipping_fee)} · <b>الإجمالي ${money(o.total)}</b></span></div>
  <div class="row" style="margin-top:8px"><select data-id="${o.id}" data-f="status">${Object.entries(ST).map(([k,v])=>`<option value="${k}"${k===o.status?' selected':''}>${v}</option>`).join('')}</select>
  <select data-id="${o.id}" data-f="payment_status">${Object.entries(PS).map(([k,v])=>`<option value="${k}"${k===o.payment_status?' selected':''}>${v}</option>`).join('')}</select></div></div>`).join('');
  $('ol').querySelectorAll('select[data-id]').forEach(s=>s.onchange=async()=>{await q(db.from('orders').update({[s.dataset.f]:s.value}).eq('id',s.dataset.id));const o=ORD.find(x=>x.id==s.dataset.id);o[s.dataset.f]=s.value;toast('تم الحفظ');if(s.dataset.f==='status')drawOrders()})}
function exportCsv(){const L=filtered(),c=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['رقم الطلب','التاريخ','الاسم','التليفون','المحافظة','العنوان','المنتجات','الدفع','حالة الدفع','الحالة','الشحن','الإجمالي'].map(c).join(',')].concat(L.map(o=>[o.order_number,fdate(o.created_at),o.customer_name,o.customer_phone,o.governorate_name,o.address,(o.order_items||[]).map(i=>i.product_name_ar+(i.flavor_name?' - '+i.flavor_name:'')+' x'+i.cartons_qty).join(' | '),PM[o.payment_method],PS[o.payment_status],ST[o.status],o.shipping_fee,o.total].map(c).join(',')));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv'}));a.download='orders.csv';a.click()}

// ---------- المنتجات ----------
let PRD=[];
async function products(){
  PRD=await q(db.from('products').select('*').order('sort_order').order('id'));
  $('view').innerHTML=(isAdmin()?'<button class="btn" id="np" style="margin-bottom:10px">+ منتج جديد</button>':'')+PRD.map(p=>`<div class="card between"><div style="flex:1"><b>${esc(p.name_ar)}</b> ${p.is_active?'':'<span class="tag">مخفي</span>'}<div class="mut">${money(p.price)} للكرتونة · ${esc(CAT[p.category]||'بدون فئة')} · ${(p.flavors||[]).length} نكهات</div></div>${isAdmin()?`<button class="btn sec sm" data-e="${p.id}">تعديل</button>`:''}</div>`).join('');
  if(isAdmin()){$('np').onclick=()=>prodForm();$('view').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>prodForm(PRD.find(x=>x.id==b.dataset.e)))}
}
function flRow(f={}){return `<div class="fl"><input placeholder="كود" value="${esc(f.id)}"><input placeholder="الاسم عربي" value="${esc(f.name_ar)}"><input placeholder="English" value="${esc(f.name_en)}"><input placeholder="سعر" type="number" value="${f.price??''}"><button type="button" class="btn red sm" onclick="this.parentNode.remove()">×</button></div>`}
function prodForm(p){p=p||{price:0,is_active:true,sort_order:PRD.length+1,flavors:[]};const d=$('dlg');
  d.innerHTML=`<h3 style="margin-top:0">${p.id?'تعديل منتج':'منتج جديد'}</h3>
  <label>الاسم (عربي)</label><input id="pa" value="${esc(p.name_ar)}"><label>الاسم (English)</label><input id="pe" value="${esc(p.name_en)}">
  <label>الوصف (عربي)</label><textarea id="da">${esc(p.description_ar)}</textarea><label>الوصف (English)</label><textarea id="de">${esc(p.description_en)}</textarea>
  <div class="row"><div><label>سعر الكرتونة</label><input id="pp" type="number" value="${p.price}"></div><div><label>قطع/كرتونة</label><input id="pc" type="number" value="${p.pieces_per_carton??''}"></div>
  <div><label>الفئة</label><select id="pf"><option value="">بدون</option>${Object.entries(CAT).map(([k,v])=>`<option value="${k}"${p.category===k?' selected':''}>${v}</option>`).join('')}</select></div><div><label>الترتيب</label><input id="ps" type="number" value="${p.sort_order}"></div></div>
  <label>الصورة (رابط أو مسار مثل img/product-9.jpeg)</label><input id="pi" value="${esc(p.image_url)}"><input id="pu" type="file" accept="image/*" style="margin-top:4px">
  <label>النكهات (اتركها فاضية لو مفيش)</label><div id="fls">${(p.flavors||[]).map(flRow).join('')}</div><button type="button" class="btn sec sm" id="af">+ نكهة</button>
  <label><input id="pv" type="checkbox" style="width:auto" ${p.is_active?'checked':''}> ظاهر في الموقع</label>
  <div class="row" style="margin-top:10px"><button class="btn" id="sv">حفظ</button><button class="btn sec" id="cl">إلغاء</button>${p.id?'<button class="btn red" id="dl">حذف</button>':''}</div>`;
  d.showModal();$('cl').onclick=()=>d.close();$('af').onclick=()=>$('fls').insertAdjacentHTML('beforeend',flRow());
  $('pu').onchange=async e=>{const f=e.target.files[0];if(!f)return;const n='p'+Date.now()+'.'+f.name.split('.').pop();const{error}=await db.storage.from('product-images').upload(n,f);if(error){toast('الرفع فشل (تأكد من إنشاء bucket): '+error.message);return}$('pi').value=db.storage.from('product-images').getPublicUrl(n).data.publicUrl;toast('تم رفع الصورة')};
  $('sv').onclick=async()=>{const fl=[...$('fls').children].map(r=>{const i=r.querySelectorAll('input');const o={id:i[0].value.trim(),name_ar:i[1].value.trim(),name_en:i[2].value.trim()||i[1].value.trim()};if(i[3].value!=='')o.price=Number(i[3].value);return o}).filter(o=>o.id&&o.name_ar);
    const row={name_ar:$('pa').value.trim(),name_en:$('pe').value.trim()||null,description_ar:$('da').value.trim()||null,description_en:$('de').value.trim()||null,price:Number($('pp').value),pieces_per_carton:$('pc').value?Number($('pc').value):null,category:$('pf').value||null,sort_order:Number($('ps').value)||0,image_url:$('pi').value.trim()||null,flavors:fl,is_active:$('pv').checked};
    if(!row.name_ar||!(row.price>=0)){toast('الاسم والسعر مطلوبين');return}
    await q(p.id?db.from('products').update(row).eq('id',p.id):db.from('products').insert(row));d.close();toast('تم الحفظ');products()};
  if(p.id)$('dl').onclick=async()=>{if(!confirm('حذف المنتج نهائيًا؟ (الأفضل إخفاؤه)'))return;await q(db.from('products').delete().eq('id',p.id));d.close();products()}}

// ---------- العملاء ----------
async function customers(){
  const C=await q(db.from('v_customer_summary').select('*').order('total_spent',{ascending:false}).limit(300));
  $('view').innerHTML=`<input id="cq" placeholder="بحث بالاسم أو التليفون" style="margin-bottom:10px"><div id="cl2"></div>`;
  const draw=()=>{const t=$('cq').value.trim().toLowerCase();$('cl2').innerHTML=C.filter(c=>!t||(c.full_name+c.phone).toLowerCase().includes(t)).map(c=>`<div class="card" data-c="${c.id}" style="cursor:pointer"><div class="between"><b>${esc(c.full_name)}</b><span>${money(c.total_spent)}</span></div><div class="mut">${esc(c.phone)} · ${esc(c.governorate||'')} · ${c.orders_count} طلب${c.last_order_at?' · آخر طلب '+fdate(c.last_order_at):''}</div><div class="cd"></div></div>`).join('')||'<p class="mut">لا يوجد عملاء.</p>'};
  draw();$('cq').oninput=draw;
  $('cl2').onclick=async e=>{const c=e.target.closest('[data-c]');if(!c)return;const box=c.querySelector('.cd');if(box.innerHTML){box.innerHTML='';return}
    const O=await q(db.from('orders').select('order_number,created_at,total,status').eq('customer_id',c.dataset.c).order('created_at',{ascending:false}).limit(30));
    box.innerHTML=O.map(o=>`<div class="between mut" style="margin-top:4px"><span>${esc(o.order_number)} · ${fdate(o.created_at)}</span><span>${money(o.total)} · ${esc(ST[o.status])}</span></div>`).join('')}}

// ---------- المحافظات (الشحن والحد الأدنى) ----------
async function gov(){
  $('view').innerHTML=`<p class="mut">سعر الشحن والحد الأدنى للطلب لكل محافظة (بالجنيه)${isAdmin()?'':' — للعرض فقط'}</p>`+govs.map(g=>`<div class="card"><b>${esc(g.name_ar)}</b><div class="row"><div><label>الشحن</label><input type="number" data-g="${g.id}" data-f="shipping_fee" value="${g.shipping_fee}" ${isAdmin()?'':'disabled'}></div><div><label>الحد الأدنى</label><input type="number" data-g="${g.id}" data-f="min_order" value="${g.min_order}" ${isAdmin()?'':'disabled'}></div>
  <label style="flex:0 0 auto"><input type="checkbox" style="width:auto" data-g="${g.id}" data-f="is_active" ${g.is_active?'checked':''} ${isAdmin()?'':'disabled'}> مفعّلة</label></div></div>`).join('');
  $('view').querySelectorAll('[data-g]').forEach(i=>i.onchange=async()=>{const v=i.type==='checkbox'?i.checked:Number(i.value);if(i.type==='number'&&!(v>=0)){toast('قيمة غير صحيحة');return}await q(db.from('governorates').update({[i.dataset.f]:v}).eq('id',i.dataset.g));toast('تم الحفظ')})}

boot();
</script>
</body>
</html>
